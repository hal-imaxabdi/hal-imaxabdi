name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#57606a&color_dots=#ebedf0,#d0d7de,#afb8c1,#8c959f,#6e7781
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c9d1d9&color_dots=#161b22,#30363d,#484f58,#6e7681,#8b949e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
